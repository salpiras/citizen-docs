# Project-wide Gradle settings.
# Settings configured through the IDE will override anything specified here.

org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1 -XX:ReservedCodeCacheSize=320m -Xmx2g

# A 13-module graph benefits a lot from these.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# Warn rather than fail if a third-party plugin is not yet configuration-cache clean.
org.gradle.configuration-cache.problems=warn

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Disable build features that default to on but this project never uses.
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false

# Run the Roborazzi screenshot comparison as part of the normal unit test task.
roborazzi.test.verify=true

ksp.project.isolation.enabled=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
