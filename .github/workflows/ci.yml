name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check formatting
        run: ./gradlew spotlessCheck

      # Treats Kotlin warnings as errors in CI only, so local iteration stays quick.
      - name: Build
        run: ./gradlew assembleDebug -PwarningsAsErrors=true

      # Also verifies the committed Roborazzi goldens, via roborazzi.test.verify=true.
      - name: Unit, behaviour and screenshot tests
        run: ./gradlew testDebugUnitTest test

      - name: Android lint
        run: ./gradlew lint

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/outputs/roborazzi/**
